[package]
name = "amber"
version = "0.1.0"
edition = "2024"

[lib]
name = "libamber"
path = "src/lib.rs"

[[bin]]
name = "amber"
path = "src/main.rs"

[[bin]]
name = "alloc"
path = "src/alloc.rs"

[dependencies]
nom = "8.0"
im = "15.1"
rand = "0.10.2"
panic-context = "0.1.0"
dhat = { version = "0.3.3", optional = true }

[profile.release]
debug = 1

[features]
dhat-heap = ["dhat"]